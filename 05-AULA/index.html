<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <header>
        <h1> TRABALHANDO COM INPUTS </h1>
    </header>

    <!-- INPUT -->
     <main>
      <h2>Formulário de cadastro<h2>

      <!-- input - coleta informações do usuário-->
       <!-- form - englobar os campos do formulário-->
        <!-- method - pra onde vão as informações preenchidas-->
         <!--action - pra onde vão as informações preenchidas-->
      <form action="" method="">

        <!--label - texto de apoio pra guiar o input-->
        <!-- forma 1 - label sem input-->
        <label for="nomeCompleto"> Nome Completo: </label>
        <!-- text - caracteres em geral-->
        <!-- name - usado para identificar o input quando enviar os dados-->
        <!--id - identificação daquele elemento html-->
        <input type="text" name="nomeCompleto" id="nomeCompleto">
         
          <br> <br>  
          
        <!-- input dentro label-->  
        <label for="">
          senha:
          <!-- password - senhas -->
          <input type="password" name="nomeCompleto" id="nomeCompleto">
          </label>
        </form>
     </main>
<footer>
    <p>DIREITOS SÃO MEUS, EU QUE FIZ TUDO </p>
</footer>
</body>
</html>
